name: cliq_term
description: "Terminal emulator for the SSH and SFTP client cliq"
version: 0.0.1
homepage: https://github.com/cliq-ssh/cliq

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0-0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  cupertino_ui: any
  material_ui: any

dev_dependencies:
  cliq_term_devtools:
    path: ../cliq_term_devtools
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.30.0
