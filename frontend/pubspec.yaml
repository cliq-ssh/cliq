name: cliq
description: "cliq: Portable and secure SSH and SFTP client."
publish_to: 'none'

version: 0.0.1+12

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0-0"

workspace:
  - packages/cliq_api
  - packages/cliq_grid

dependencies:
  flutter:
    sdk: flutter
  cliq_api:
    path: packages/cliq_api
  cliq_grid:
    path: packages/cliq_grid
  dartssh2:
    git:
      url: https://github.com/cliq-ssh/dartssh2.git
      ref: master
  multiview_desktop:
    git:
      url: https://github.com/focale-editor/multi-view-desktop.git
      ref: main

  lucide_flutter: 1.75.0
  go_router: 18.1.4
  flutter_hooks: 0.21.4
  shared_preferences: 2.5.6
  hooks_riverpod: 3.5.0
  riverpod: 3.5.0
  logging: ^1.3.0
  drift: 2.35.4
  drift_flutter: 0.3.1
  path_provider: ^2.1.6
  forui: 0.28.0
  forui_hooks: 0.28.0
  uuid: 4.6.0
  simple_icons: ^16.23.0
  url_launcher: ^6.3.3
  crypto: ^3.0.8
  file_selector: ^1.1.0
  sodium: ^4.1.2
  pointycastle: ^4.0.0
  open_app_file: ^4.0.5
  easy_localization: ^3.0.8
  macos_window_utils: ^1.9.1
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  iterm2_color_schemes_dart: ^2.0.1
  share_plus: ^13.3.1
  cupertino_ui: ^1.1.7
  material_ui: any
  flterm: ^0.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  drift_dev: 2.35.3
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.8

flutter:
  assets:
    - assets/translations/

  fonts:
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Italic.ttf
          style: italic
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexMono/IBMPlexMono-LightItalic.ttf
          weight: 300
          style: italic

    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-VariableFont_wght.ttf
        - asset: assets/fonts/SourceCodePro-Italic-VariableFont_wght.ttf
          style: italic

    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
        - asset: assets/fonts/JetBrainsMono-Italic[wght].ttf
          style: italic
