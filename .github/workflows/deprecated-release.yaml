name: "Deprecated! Release"

on:
  workflow_dispatch:
    inputs:
      is-beta-release:
        description: 'Is this a beta release?'
        type: boolean
        required: false
        default: false
      promote-ios:
        description: 'Promote the iOS build'
        type: boolean
        required: false
        default: true
      promote-macos:
        description: 'Promote the macOS build'
        type: boolean
        required: false
        default: true
      promote-backend:
        description: 'Promote the backend image'
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    needs: checks-passed
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      owner: ${{ steps.version.outputs.owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test -n "$VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  frontend-checks:
    name: Frontend Checks
    uses: ./.github/workflows/frontend-checks.yaml
    permissions:
      contents: read
      actions: read
      checks: write

  backend-checks:
    name: Backend checks
    uses: ./.github/workflows/backend-checks.yaml
    permissions:
      contents: read
      actions: read
      checks: write
      security-events: write


  checks-passed:
    needs: [ frontend-checks, backend-checks ]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"

  download-edge-assets:
    name: Download edge release assets
    needs: checks-passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download assets from edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download edge \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern '*' \
            --clobber

      - name: List downloaded assets
        run: find artifacts -type f -ls

      - name: Upload edge release assets
        uses: actions/upload-artifact@v7
        with:
          name: edge-release-assets
          path: artifacts/*
          if-no-files-found: error

  promote-ios:
    name: Promote iOS build
    needs: download-edge-assets
    runs-on: macos-latest
    steps:
      - name: Skip iOS promotion
        if: ${{ !inputs.promote-ios }}
        run: echo "iOS promotion is disabled."

      - name: Checkout
        if: ${{ inputs.promote-ios }}
        uses: actions/checkout@v7

      - name: Set up Ruby
        if: ${{ inputs.promote-ios }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
          working-directory: frontend/ios

      - name: Promote iOS build
        if: ${{ inputs.promote-ios }}
        working-directory: frontend/ios
        env:
          RELEASE_BETA: ${{ inputs.is-beta-release }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane ios promote

  promote-macos:
    name: Promote macOS build
    needs: download-edge-assets
    runs-on: macos-latest
    steps:
      - name: Skip macOS promotion
        if: ${{ !inputs.promote-macos }}
        run: echo "macOS promotion is disabled."

      - name: Checkout
        if: ${{ inputs.promote-macos }}
        uses: actions/checkout@v7

      - name: Set up Ruby
        if: ${{ inputs.promote-macos }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
          working-directory: frontend/macos

      - name: Promote macOS build
        if: ${{ inputs.promote-macos }}
        working-directory: frontend/macos
        env:
          RELEASE_BETA: ${{ inputs.is-beta-release }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: bundle exec fastlane mac promote

  promote-backend:
    name: Promote backend Docker image
    needs: [ checks-passed, resolve-version ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_IMAGE: ghcr.io/${{ needs.resolve-version.outputs.owner }}/backend-dev
      TARGET_IMAGE: ghcr.io/${{ needs.resolve-version.outputs.owner }}/backend
    steps:
      - name: Skip backend promotion
        if: ${{ !inputs.promote-backend }}
        run: echo "Backend promotion is disabled."

      - name: Login to GHCR
        if: ${{ inputs.promote-backend }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Docker manifests
        if: ${{ inputs.promote-backend }}
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${VERSION}" \
            --tag "${TARGET_IMAGE}:latest" \
            "${SOURCE_IMAGE}:edge"
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${VERSION}-alpine" \
            --tag "${TARGET_IMAGE}:alpine" \
            "${SOURCE_IMAGE}:edge-alpine"

  pre-release-checks:
    name: Pre release checks
    needs: [ resolve-version, download-edge-assets, promote-ios, promote-macos, promote-backend ]
    if: |
      always() &&
      needs.resolve-version.result == 'success' &&
      needs.download-edge-assets.result == 'success' &&
      needs.promote-ios.result != 'failure' &&
      needs.promote-macos.result != 'failure' &&
      needs.promote-backend.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - run: echo "All pre release checks passed"

  release:
    name: Create draft release
    needs: [ pre-release-checks, resolve-version ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download edge release assets
        uses: actions/download-artifact@v8
        with:
          name: edge-release-assets
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          tag_name: v${{ needs.resolve-version.outputs.version }}
          prerelease: ${{ inputs.is-beta-release }}
          files: artifacts/*
