name: "Backend: Build Docker"
on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: ./backend  # Change the working directory to /backend

jobs:
  build-docker:
    name: Build (${{ matrix.variant }} / ${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            variant: debian
            dockerfile: ./backend/docker/prod/debian.Dockerfile
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            variant: debian
            dockerfile: ./backend/docker/prod/debian.Dockerfile
          - os: ubuntu-24.04
            platform: linux/amd64
            variant: alpine
            dockerfile: ./backend/docker/prod/alpine.Dockerfile
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            variant: alpine
            dockerfile: ./backend/docker/prod/alpine.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
