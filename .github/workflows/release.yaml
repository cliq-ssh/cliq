name: "Release"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        type: string
        required: true
      is-beta-release:
        description: 'Is this a beta release?'
        type: boolean
        required: false
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          php -r '
            $version = getenv("VERSION");
            $regex = "/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/";

            if (!preg_match($regex, $version)) {
                fwrite(STDERR, "::error::\"$version\" is not a valid semantic version.\n");
                exit(1);
            }
          '

          echo "Version '$VERSION' is valid."

  frontend-checks:
    name: Frontend Checks
    needs: validate-version
    uses: ./.github/workflows/frontend-checks.yaml
    permissions:
      contents: read
      actions: read
      checks: write

  backend-checks:
    name: Backend checks
    needs: validate-version
    uses: ./.github/workflows/backend-checks.yaml
    permissions:
      contents: read
      actions: read
      checks: write
      security-events: write


  checks-passed:
    needs: [ frontend-checks, backend-checks ]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All checks passed"

  download-edge-assets:
    name: Download edge release assets
    needs: checks-passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download assets from edge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download edge \
            --repo "$GITHUB_REPOSITORY" \
            --dir artifacts \
            --pattern '*' \
            --clobber

      - name: List downloaded assets
        run: find artifacts -type f -ls

      - name: Upload edge release assets
        uses: actions/upload-artifact@v7
        with:
          name: edge-release-assets
          path: artifacts/*
          archive: false
          if-no-files-found: error

  promote-ios:
    name: Promote iOS build
    needs: download-edge-assets
    runs-on: ubuntu-latest
    steps:
      - run: echo "iOS promotion is not needed at this time."

  promote-backend:
    name: Promote backend Docker image
    needs: checks-passed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_IMAGE: ghcr.io/cliq-ssh/backend-dev
      TARGET_IMAGE: ghcr.io/cliq-ssh/backend
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote Docker manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${VERSION}" \
            --tag "${TARGET_IMAGE}:latest" \
            "${SOURCE_IMAGE}:edge"
          docker buildx imagetools create \
            --tag "${TARGET_IMAGE}:${VERSION}-alpine" \
            --tag "${TARGET_IMAGE}:alpine" \
            "${SOURCE_IMAGE}:edge-alpine"

  pre-release-checks:
    name: Pre release checks
    needs: [ download-edge-assets, promote-ios, promote-backend ]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All pre release checks passed"

  release:
    name: Create draft release
    needs: pre-release-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download edge release assets
        uses: actions/download-artifact@v8
        with:
          name: edge-release-assets
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          tag_name: v${{ inputs.version }}
          prerelease: ${{ inputs.is-beta-release }}
          files: artifacts/*
