name: "Release"

on:
  workflow_dispatch:
    inputs:
      release-channel:
        description: "Release channel"
        type: choice
        required: true
        default: edge
        options:
          - edge
          - beta
          - prod
      increment-build-number:
        description: "Increment the frontend build number"
        type: boolean
        required: false
        default: true
      build-ios:
        description: "Build and publish iOS"
        type: boolean
        required: false
        default: true
      build-macos:
        description: "Build and publish macOS"
        type: boolean
        required: false
        default: true
      build-backend:
        description: "Build and publish the backend image"
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-channel:
    name: Validate release channel
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsupported release channel
        if: ${{ inputs.release-channel != 'edge' }}
        run: |
          echo "::error::The ${{ inputs.release-channel }} release channel is not implemented yet."
          exit 1
      - name: Use edge release channel
        if: ${{ inputs.release-channel == 'edge' }}
        run: echo "Using edge release channel"

  frontend-checks:
    name: Frontend Checks
    uses: ./.github/workflows/frontend-checks.yaml
    permissions:
      contents: read
      actions: read
      checks: write

  backend-checks:
    name: Backend Checks
    uses: ./.github/workflows/backend-checks.yaml
    permissions:
      contents: read
      actions: read
      checks: write
      security-events: write

  checks-passed:
    name: Checks passed
    if: always()
    needs: [ release-channel, frontend-checks, backend-checks ]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  bump-version:
    name: Bump build number
    needs: checks-passed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      build-number: ${{ steps.bump.outputs.build-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bump build number
        id: bump
        if: ${{ inputs.increment-build-number }}
        run: |
          set -euo pipefail
          CURRENT_LINE=$(grep -E '^version:' frontend/pubspec.yaml)
          CURRENT_BUILD=$(echo "$CURRENT_LINE" | sed -E 's/^version: [0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*/\1/')
          NEW_BUILD=$((CURRENT_BUILD + 1))
          sed -i -E "s/^(version: [0-9]+\.[0-9]+\.[0-9]+\+)[0-9]+/\1${NEW_BUILD}/" frontend/pubspec.yaml
          echo "Old: $CURRENT_LINE"
          echo "New: $(grep -E '^version:' frontend/pubspec.yaml)"
          echo "build-number=${NEW_BUILD}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        id: commit
        if: ${{ inputs.increment-build-number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump frontend build number to ${{ steps.bump.outputs.build-number }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-frontend-installers:
    name: Build frontend installers
    needs: [ checks-passed, bump-version ]
    uses: ./.github/workflows/frontend-build.yaml
    with:
      ref: ${{ needs.bump-version.outputs.sha || github.sha }}
    permissions:
      contents: read

  build-backend-jar:
    name: Build backend JAR
    needs: [ checks-passed, bump-version ]
    uses: ./.github/workflows/backend-build-jar.yaml
    with:
      upload-jar: true
    permissions:
      contents: read
      actions: read

  builds-passed:
    name: Builds passed
    needs: [ build-frontend-installers, build-backend-jar ]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  publish-ios:
    name: Build and publish iOS to TestFlight
    needs: [ builds-passed, bump-version ]
    if: ${{ inputs.build-ios }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: frontend/ios

      - name: Build and upload iOS to TestFlight
        working-directory: frontend/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ..
          flutter build ios --release --no-codesign
          cd ios
          bundle exec fastlane ios edge

  publish-macos:
    name: Build and publish macOS to TestFlight
    needs: [ builds-passed, bump-version ]
    if: ${{ inputs.build-macos }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.7"
          bundler-cache: true
          working-directory: frontend/macos

      - name: Build and upload macOS to TestFlight
        working-directory: frontend/macos
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd ..
          flutter build macos --release
          cd macos
          bundle exec fastlane mac edge

  publish-backend:
    name: Build and publish backend
    needs: [ builds-passed ]
    if: ${{ inputs.build-backend }}
    uses: ./.github/workflows/backend-publish-edge.yaml
    permissions:
      contents: read
      packages: write
      actions: read

  publish-passed:
    name: Publishing passed
    needs: [ publish-ios, publish-macos, publish-backend ]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: publish-ios,publish-macos,publish-backend
          jobs: ${{ toJSON(needs) }}

  release:
    name: Create or update edge release
    needs: [ publish-passed ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump-version.outputs.sha || github.sha }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: artifacts
          merge-multiple: true

      - name: Filter release assets
        run: |
          set -euo pipefail
          find artifacts -type f ! \( \
            -name '*.jar' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.exe' -o \
            -name '*.dmg' \
          \) -delete
          find artifacts -type f -size 0 -delete

      - name: Remove existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view edge --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view edge \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' |
              while IFS= read -r asset; do
                if [ -n "$asset" ]; then
                  gh release delete-asset edge "$asset" \
                    --repo "$GITHUB_REPOSITORY" \
                    --yes
                fi
              done
          fi

      - name: Prepare release notes
        id: release-info
        run: echo "updated=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Create or update prerelease
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: true
          tag_name: edge
          name: edge
          body: |
            Updated: ${{ steps.release-info.outputs.updated }}
          files: artifacts/*
