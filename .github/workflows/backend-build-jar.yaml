name: "Backend: Build Jar"
on:
  workflow_call:
    inputs:
      upload-jar:
        type: boolean
        required: false
        default: false

defaults:
  run:
    working-directory: ./backend  # Change the working directory to /backend

jobs:
  build:
    name: Build Jar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: "26"
          distribution: "temurin"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Run detekt
        run: ./gradlew bootJar --no-daemon
      - name: Rename Jar
        run: mv build/libs/*.jar build/libs/cliq-backend.jar
      - name: Upload Jar
        if: ${{ inputs.upload-jar }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/build/libs/cliq-backend.jar
          archive: false
          if-no-files-found: error
