name: "Backend: Publish Beta"

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Docker tag for the beta image"
        type: string
        required: true

concurrency:
  group: backend-beta
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image name
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.owner.outputs.owner }}
    steps:
      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.variant }} / ${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    env:
      GHCR_REPO: ghcr.io/${{ needs.prepare.outputs.owner }}/backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            variant: debian
            dockerfile: ./backend/docker/prod/debian.Dockerfile
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            variant: debian
            dockerfile: ./backend/docker/prod/debian.Dockerfile
          - os: ubuntu-24.04
            platform: linux/amd64
            variant: alpine
            dockerfile: ./backend/docker/prod/alpine.Dockerfile
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            variant: alpine
            dockerfile: ./backend/docker/prod/alpine.Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "VARIANT=${{ matrix.variant }}" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.GHCR_REPO }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: beta-digests-${{ env.VARIANT }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Publish beta manifest (${{ matrix.variant }})
    needs: [ prepare, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_REPO: ghcr.io/${{ needs.prepare.outputs.owner }}/backend
    strategy:
      matrix:
        include:
          - variant: debian
            suffix: ""
          - variant: alpine
            suffix: "-alpine"
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: beta-digests-${{ matrix.variant }}-*
          merge-multiple: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push beta manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_TAG: ${{ inputs.image-tag }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${GHCR_REPO}:${IMAGE_TAG}${SUFFIX}" \
            $(printf "${GHCR_REPO}@sha256:%s " *)
